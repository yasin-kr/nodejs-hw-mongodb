tags:
  - Auth
summary: Register user
operationId: registerUser
description: Register a new user.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [name, email, password]
        properties:
          name:
            type: string
            example: Yasin
          email:
            type: string
            format: email
            example: yasin@example.com
          password:
            type: string
            example: password123
responses:
  '201':
    description: Successfully registered a user.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              $ref: ../../../components/schemas/user.yaml
  '409':
    description: Email in use.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
