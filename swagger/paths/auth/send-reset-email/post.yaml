tags:
  - Auth
summary: Send reset password email
operationId: sendResetPasswordEmail
description: Send a password reset email to the user.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email]
        properties:
          email:
            type: string
            format: email
            example: yasin@example.com
responses:
  '200':
    description: Reset password email has been sent.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
  '404':
    description: User not found.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
