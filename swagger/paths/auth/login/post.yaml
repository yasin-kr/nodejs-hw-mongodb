tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login a user and receive an access token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email, password]
        properties:
          email:
            type: string
            format: email
            example: yasin@example.com
          password:
            type: string
            example: password123
responses:
  '200':
    description: Successfully logged in a user.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
  '401':
    description: Invalid credentials.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
