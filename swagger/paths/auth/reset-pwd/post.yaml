tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: Reset a user password using the JWT token from email.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [token, password]
        properties:
          token:
            type: string
          password:
            type: string
            example: newPassword123
responses:
  '200':
    description: Password has been reset.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
  '401':
    description: Token is expired or invalid.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
  '404':
    description: User not found.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
