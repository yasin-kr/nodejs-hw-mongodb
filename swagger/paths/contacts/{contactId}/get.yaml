tags:
  - Contacts
summary: Get contact by id
operationId: getContactById
description: Get one contact by id. The contact must belong to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: Contact id.
responses:
  '200':
    description: Successfully found contact.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 6690f1a6c9f1d2a1b2c3d4e5!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    description: Unauthorized.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
  '404':
    description: Contact not found.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
