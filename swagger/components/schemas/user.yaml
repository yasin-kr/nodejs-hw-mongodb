type: object
required:
  - _id
  - name
  - email
properties:
  _id:
    type: string
    example: 6690f1a6c9f1d2a1b2c3d4e6
  name:
    type: string
    example: Yasin
  email:
    type: string
    format: email
    example: yasin@example.com
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
