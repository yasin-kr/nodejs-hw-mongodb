type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - isFavourite
  - userId
properties:
  _id:
    type: string
    example: 6690f1a6c9f1d2a1b2c3d4e5
  name:
    type: string
    minLength: 3
    maxLength: 20
    example: John Doe
  phoneNumber:
    type: string
    minLength: 3
    maxLength: 20
    example: '+380000000001'
  email:
    type: string
    nullable: true
    example: john@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    example: personal
  photo:
    type: string
    nullable: true
    example: https://res.cloudinary.com/demo/image/upload/contacts/photo.jpg
  userId:
    type: string
    example: 6690f1a6c9f1d2a1b2c3d4e6
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
